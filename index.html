<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Soul Room</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d10;
      color: #d7f7d7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    main {
      width: min(92vw, 720px);
      border: 1px solid #2f5240;
      border-radius: 10px;
      background: #12171f;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    pre {
      margin: 0;
      min-height: 250px;
      line-height: 1.2;
      font-size: 16px;
      white-space: pre;
      overflow-x: auto;
      color: #96ff9f;
    }
    .hud {
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: #d3ead7;
      font-size: 14px;
    }
    .controls {
      margin-top: 10px;
      color: #9ec4a2;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="hud" id="hud"></div>
    <pre id="screen" aria-live="polite"></pre>
    <div class="controls" id="controls"></div>
  </main>

  <script>
    const FLOOR = '.';
    const WALL = '#';
    const EXIT = '>';
    const OBSTACLE = 'O';
    const PLAYER_CHAR = '@';
    const PROJECTILE_CHAR = '*';
    const ENEMY_CHARS = { melee: 'M', ranged: 'R' };

    const MIN_WIDTH = 21;
    const MAX_WIDTH = 33;
    const MIN_HEIGHT = 11;
    const MAX_HEIGHT = 19;
    const MIN_LEVELS_PER_FLOOR = 2;
    const MAX_LEVELS_PER_FLOOR = 4;
    const MAX_ENEMY_CAP = 10;
    const ENEMY_DENSITY = 60;
    const OBSTACLE_DENSITY = 0.08;
    const PLAYER_MAX_HP = 8;
    const RANGED_COOLDOWN_TURNS = 3;
    const MAX_PLACEMENT_TRIES = 2000;
    const MIN_SPAWN_X = 2;
    const SPAWN_WIDTH_DIVISOR = 3;
    const ENEMY_SPAWN_DIVISOR = 3;

    const KEY_TO_MOVE = {
      arrowup: [0, -1],
      w: [0, -1],
      arrowdown: [0, 1],
      s: [0, 1],
      arrowleft: [-1, 0],
      a: [-1, 0],
      arrowright: [1, 0],
      d: [1, 0]
    };
    const KEY_TO_AIM = {
      i: [0, -1],
      k: [0, 1],
      j: [-1, 0],
      l: [1, 0]
    };
    const ATTACK_KEYS = new Set([' ', 'f']);
    const HANDLED_KEYS = new Set([
      ...Object.keys(KEY_TO_MOVE),
      ...Object.keys(KEY_TO_AIM),
      ...ATTACK_KEYS
    ]);

    const game = {
      floor: 1,
      level: 1,
      levelInFloor: 1,
      levelsPerFloor: 1,
      turn: 0,
      player: { x: 0, y: 0, hp: PLAYER_MAX_HP, aim: [1, 0] },
      weapon: { name: 'Laser Carbine', damage: 1 },
      map: null,
      enemies: [],
      projectiles: [],
      message: ''
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getManhattanDistance(ax, ay, bx, by) {
      return Math.abs(ax - bx) + Math.abs(ay - by);
    }

    function isInsideMap(x, y) {
      return !!game.map && x >= 0 && y >= 0 && x < game.map.width && y < game.map.height;
    }

    function tileAt(x, y) {
      if (!isInsideMap(x, y)) return WALL;
      return game.map.tiles[y][x];
    }

    function isBlockingTile(tile) {
      return tile === WALL || tile === OBSTACLE;
    }

    function canWalk(x, y) {
      const tile = tileAt(x, y);
      return tile !== WALL && tile !== OBSTACLE;
    }

    function enemyAt(x, y) {
      return game.enemies.find((enemy) => enemy.x === x && enemy.y === y);
    }

    function isOccupied(x, y) {
      if (game.player.x === x && game.player.y === y) return true;
      return Boolean(enemyAt(x, y));
    }

    function findOpenTile({
      minX = 1,
      maxX = game.map.width - 2,
      minY = 1,
      maxY = game.map.height - 2,
      avoid = [],
      minDistance = 0
    } = {}) {
      const safeMinX = Math.min(minX, maxX);
      const safeMaxX = Math.max(minX, maxX);
      const safeMinY = Math.min(minY, maxY);
      const safeMaxY = Math.max(minY, maxY);
      for (let tries = 0; tries < MAX_PLACEMENT_TRIES; tries += 1) {
        const x = randomInt(safeMinX, safeMaxX);
        const y = randomInt(safeMinY, safeMaxY);
        if (!canWalk(x, y)) continue;
        if (isOccupied(x, y)) continue;
        if (avoid.some((spot) => getManhattanDistance(x, y, spot.x, spot.y) < minDistance)) {
          continue;
        }
        return { x, y };
      }
      for (let y = safeMinY; y <= safeMaxY; y += 1) {
        for (let x = safeMinX; x <= safeMaxX; x += 1) {
          if (!canWalk(x, y)) continue;
          if (isOccupied(x, y)) continue;
          if (avoid.some((spot) => getManhattanDistance(x, y, spot.x, spot.y) < minDistance)) {
            continue;
          }
          return { x, y };
        }
      }
      for (let y = 1; y < game.map.height - 1; y += 1) {
        for (let x = 1; x < game.map.width - 1; x += 1) {
          if (!canWalk(x, y)) continue;
          if (isOccupied(x, y)) continue;
          return { x, y };
        }
      }
      throw new Error('No open tiles available for placement.');
    }

    function clearExit() {
      for (let y = 0; y < game.map.height; y += 1) {
        for (let x = 0; x < game.map.width; x += 1) {
          if (game.map.tiles[y][x] === EXIT) game.map.tiles[y][x] = FLOOR;
        }
      }
    }

    function placeExit() {
      clearExit();
      const exitSpot = findOpenTile({
        avoid: [{ x: game.player.x, y: game.player.y }],
        minDistance: Math.floor(game.map.width / 3)
      });
      game.map.tiles[exitSpot.y][exitSpot.x] = EXIT;
    }

    function placePlayer() {
      const minX = 1;
      const spawnLimit = Math.max(MIN_SPAWN_X, Math.floor(game.map.width / SPAWN_WIDTH_DIVISOR));
      const maxX = Math.max(minX, spawnLimit);
      const spawn = findOpenTile({ minX, maxX });
      game.player.x = spawn.x;
      game.player.y = spawn.y;
    }

    function placeObstacles() {
      const area = game.map.width * game.map.height;
      const obstacleCount = Math.max(3, Math.floor(area * OBSTACLE_DENSITY));
      let placed = 0;
      while (placed < obstacleCount) {
        const x = randomInt(1, game.map.width - 2);
        const y = randomInt(1, game.map.height - 2);
        if (game.map.tiles[y][x] !== FLOOR) continue;
        game.map.tiles[y][x] = OBSTACLE;
        placed += 1;
      }
    }

    function createMap(width, height) {
      const tiles = Array.from({ length: height }, (_, y) =>
        Array.from({ length: width }, (_, x) => (x === 0 || y === 0 || x === width - 1 || y === height - 1 ? WALL : FLOOR))
      );
      game.map = { width, height, tiles };
      placeObstacles();
    }

    function spawnEnemies() {
      const area = game.map.width * game.map.height;
      const maxEnemies = Math.min(MAX_ENEMY_CAP, Math.max(2, Math.floor(area / ENEMY_DENSITY)));
      const enemyCount = randomInt(1, maxEnemies);
      const types = [];
      if (enemyCount >= 2) {
        types.push('melee', 'ranged');
      } else {
        types.push(Math.random() > 0.5 ? 'melee' : 'ranged');
      }
      while (types.length < enemyCount) {
        types.push(Math.random() > 0.5 ? 'melee' : 'ranged');
      }
      game.enemies = types.map((kind) => {
        const spawn = findOpenTile({
          minX: Math.floor(game.map.width / ENEMY_SPAWN_DIVISOR),
          avoid: [{ x: game.player.x, y: game.player.y }],
          minDistance: 3
        });
        return {
          kind,
          type: kind === 'melee' ? 'Bruiser' : 'Gunner',
          x: spawn.x,
          y: spawn.y,
          hp: kind === 'melee' ? 4 : 3,
          dmg: 1,
          cooldown: randomInt(1, RANGED_COOLDOWN_TURNS)
        };
      });
    }

    function generateFloor() {
      const width = randomInt(MIN_WIDTH, MAX_WIDTH);
      const height = randomInt(MIN_HEIGHT, MAX_HEIGHT);
      createMap(width, height);
      placePlayer();
      placeExit();
      game.levelsPerFloor = randomInt(MIN_LEVELS_PER_FLOOR, MAX_LEVELS_PER_FLOOR);
      game.levelInFloor = 1;
      game.projectiles = [];
      spawnEnemies();
      game.message = `Floor ${game.floor} begins. ${game.levelsPerFloor} levels to clear.`;
    }

    function advanceLevel() {
      game.level += 1;
      if (game.levelInFloor < game.levelsPerFloor) {
        game.levelInFloor += 1;
        placeExit();
        game.projectiles = [];
        spawnEnemies();
        game.message = `Level ${game.levelInFloor}/${game.levelsPerFloor} on floor ${game.floor}. New enemies arrive.`;
      } else {
        game.floor += 1;
        game.levelInFloor = 1;
        generateFloor();
        game.message = `You reach floor ${game.floor}. A new map unfolds.`;
      }
    }

    function resetGame() {
      game.floor = 1;
      game.level = 1;
      game.player.hp = PLAYER_MAX_HP;
      game.player.aim = [1, 0];
      generateFloor();
      game.message = 'You fell. Restarting at floor 1.';
    }

    function tryMove(dx, dy) {
      const nx = game.player.x + dx;
      const ny = game.player.y + dy;
      if (canWalk(nx, ny) && !enemyAt(nx, ny)) {
        game.player.x = nx;
        game.player.y = ny;
        if (tileAt(nx, ny) === EXIT) {
          advanceLevel();
          render();
          return;
        }
        enemyTurn();
      }
      render();
    }

    function fireLaser(dx, dy) {
      if (dx === 0 && dy === 0) {
        game.message = 'Aim the laser before firing.';
        render();
        return;
      }
      let hits = 0;
      let x = game.player.x + dx;
      let y = game.player.y + dy;
      while (isInsideMap(x, y)) {
        const tile = tileAt(x, y);
        if (isBlockingTile(tile)) break;
        const enemy = enemyAt(x, y);
        if (enemy) {
          enemy.hp -= game.weapon.damage;
          hits += 1;
        }
        x += dx;
        y += dy;
      }
      game.enemies = game.enemies.filter((enemy) => enemy.hp > 0);
      if (hits > 0) {
        game.message = hits === 1 ? 'Laser hits its mark.' : `Laser hits ${hits} targets.`;
      } else {
        game.message = 'Laser streaks through the halls.';
      }
      if (game.enemies.length === 0) {
        game.message += ` The level is clear—find ${EXIT} to advance.`;
      }
      enemyTurn();
      render();
    }

    function shootProjectile(enemy) {
      const dx = Math.sign(game.player.x - enemy.x);
      const dy = Math.sign(game.player.y - enemy.y);
      if (dx === 0 && dy === 0) return false;
      const startX = enemy.x + dx;
      const startY = enemy.y + dy;
      if (!isInsideMap(startX, startY)) return false;
      if (isBlockingTile(tileAt(startX, startY))) return false;
      game.projectiles.push({ x: startX, y: startY, dx, dy, dmg: enemy.dmg });
      return true;
    }

    function advanceProjectiles() {
      if (game.projectiles.length === 0) return;
      const remaining = [];
      for (const projectile of game.projectiles) {
        const nx = projectile.x + projectile.dx;
        const ny = projectile.y + projectile.dy;
        if (!isInsideMap(nx, ny)) continue;
        const tile = tileAt(nx, ny);
        if (isBlockingTile(tile)) continue;
        if (game.player.x === nx && game.player.y === ny) {
          game.player.hp -= projectile.dmg;
          game.message = `You are hit by a shot! HP: ${game.player.hp}`;
          if (game.player.hp <= 0) {
            resetGame();
            return true;
          }
          continue;
        }
        projectile.x = nx;
        projectile.y = ny;
        remaining.push(projectile);
      }
      game.projectiles = remaining;
      return false;
    }

    function moveEnemyToward(enemy, dx, dy) {
      const stepOptions = [];
      if (dx !== 0) stepOptions.push([dx, 0]);
      if (dy !== 0) stepOptions.push([0, dy]);
      for (const [sx, sy] of stepOptions) {
        const nx = enemy.x + sx;
        const ny = enemy.y + sy;
        if (canWalk(nx, ny) && !isOccupied(nx, ny)) {
          enemy.x = nx;
          enemy.y = ny;
          break;
        }
      }
    }

    function enemyTurn() {
      game.turn += 1;
      const reset = advanceProjectiles();
      if (reset) return;
      if (game.enemies.length === 0) return;
      for (const enemy of game.enemies) {
        const dx = Math.sign(game.player.x - enemy.x);
        const dy = Math.sign(game.player.y - enemy.y);
        const inMeleeRange = getManhattanDistance(game.player.x, game.player.y, enemy.x, enemy.y) === 1;
        if (inMeleeRange) {
          game.player.hp -= enemy.dmg;
          game.message = `${enemy.type} strikes you. HP: ${game.player.hp}`;
          if (game.player.hp <= 0) {
            resetGame();
            return;
          }
          continue;
        }
        if (enemy.kind === 'ranged') {
          enemy.cooldown = Math.max(0, enemy.cooldown - 1);
          if (enemy.cooldown === 0) {
            const fired = shootProjectile(enemy);
            if (fired) {
              enemy.cooldown = RANGED_COOLDOWN_TURNS;
              game.message = `${enemy.type} fires a shot!`;
              continue;
            }
          }
        }
        moveEnemyToward(enemy, dx, dy);
      }
    }

    function render() {
      const rows = [];
      for (let y = 0; y < game.map.height; y++) {
        let row = '';
        for (let x = 0; x < game.map.width; x++) {
          let ch = tileAt(x, y);
          const projectile = game.projectiles.find((shot) => shot.x === x && shot.y === y);
          if (projectile) ch = PROJECTILE_CHAR;
          const enemy = enemyAt(x, y);
          if (enemy) ch = ENEMY_CHARS[enemy.kind];
          if (game.player.x === x && game.player.y === y) ch = PLAYER_CHAR;
          row += ch;
        }
        rows.push(row);
      }
      document.getElementById('hud').textContent =
        `Floor: ${game.floor} | Level: ${game.levelInFloor}/${game.levelsPerFloor} | HP: ${game.player.hp} | Weapon: ${game.weapon.name} | Enemies: ${game.enemies.length}`;
      document.getElementById('screen').textContent = rows.join('\n') + `\n\n${game.message}`;
    }

    function renderControls() {
      const moveKeys = Object.keys(KEY_TO_MOVE);
      const arrowKeys = ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
      const wasdKeys = ['w', 'a', 's', 'd'];
      const moveParts = [];
      if (wasdKeys.every((key) => moveKeys.includes(key))) moveParts.push('WASD');
      if (arrowKeys.every((key) => moveKeys.includes(key))) moveParts.push('Arrow Keys');
      const attackKeys = Array.from(ATTACK_KEYS).map((key) => key === ' ' ? 'Space' : key.toUpperCase());
      document.getElementById('controls').textContent =
        `Move: ${moveParts.join('/')} • Fire laser: ${attackKeys.join('/')} (uses last move direction) • Aim and fire: I/J/K/L • Reach ${EXIT} to clear levels; finishing all levels advances to the next floor.`;
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (HANDLED_KEYS.has(key)) {
        event.preventDefault();
      }
      if (KEY_TO_MOVE[key]) {
        const [dx, dy] = KEY_TO_MOVE[key];
        game.player.aim = [dx, dy];
        tryMove(dx, dy);
      } else if (KEY_TO_AIM[key]) {
        const [dx, dy] = KEY_TO_AIM[key];
        game.player.aim = [dx, dy];
        fireLaser(dx, dy);
      } else if (ATTACK_KEYS.has(key)) {
        const [dx, dy] = game.player.aim;
        fireLaser(dx, dy);
      }
    });

    generateFloor();
    renderControls();
    render();
  </script>
</body>
</html>
