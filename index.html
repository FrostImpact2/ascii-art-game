<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embers of the Dark Room</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d10;
      color: #d7f7d7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    main {
      width: min(94vw, 780px);
      border: 1px solid #2f5240;
      border-radius: 10px;
      background: #12171f;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    pre {
      margin: 0;
      min-height: 280px;
      line-height: 1.2;
      font-size: 15px;
      white-space: pre;
      overflow-x: auto;
      color: #96ff9f;
    }
    .hud {
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #d3ead7;
      font-size: 13px;
    }
    .controls {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .controls button {
      border: 1px solid #2f5240;
      background: #1a222e;
      color: #d7f7d7;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }
    .controls button:hover:not(:disabled) {
      border-color: #5aa673;
      transform: translateY(-1px);
    }
    .controls button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .controls .hint {
      flex-basis: 100%;
      color: #9ec4a2;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="hud" id="hud"></div>
    <pre id="screen" aria-live="polite"></pre>
    <div class="controls" id="controls"></div>
  </main>

  <script>
    const ACTION_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'q', 'w', 'e', 'r', 't'];
    const CLASS_TEMPLATES = [
      { name: 'Fighter', hp: 8, power: 2 },
      { name: 'Ranger', hp: 6, power: 3 },
      { name: 'Mage', hp: 5, power: 4 },
      { name: 'Cleric', hp: 7, power: 2 }
    ];
    const NAMES = ['Ari', 'Borin', 'Cora', 'Dain', 'Elara', 'Fenn', 'Greer', 'Hale', 'Iona', 'Jora'];
    const EPITHETS = ['the Bold', 'the Quiet', 'the Keen', 'the Stalwart', 'the Ember', 'the Rune'];

    const SCENES = {
      roomCold: [
        '      _____________      ',
        '     /            /|     ',
        '    /____________/ |     ',
        '    |    ...     | |     ',
        '    |   (   )    | |     ',
        '    |    ) (     | |     ',
        '    |   (   )    | /     ',
        '    |____)__(____|/      ',
        '        (   )           ',
        '         ) (            ',
        '        (   )           ',
        '         ---            '
      ],
      roomWarm: [
        '      _____________      ',
        '     /            /|     ',
        '    /____________/ |     ',
        '    |   .-""-.   | |     ',
        '    |  (  () )   | |     ',
        '    |   \ || /   | |     ',
        '    |    \__/    | /     ',
        '    |____/__\____|/      ',
        '       _/    \_         ',
        '      /  /\    \        ',
        '     /__/  \____\       ',
        '         /  \           '
      ],
      roomBright: [
        '      _____________      ',
        '     /            /|     ',
        '    /____________/ |     ',
        '    |   .----.   | |     ',
        '    |  (====)    | |     ',
        '    |   \__/     | |     ',
        '    |  / /\\ \    | /     ',
        '    |_/______\___|/      ',
        '      /  /\  \          ',
        '     /__/  \__\         ',
        '        /\              ',
        '       /__\             '
      ],
      village: [
        '        /\\    /\\       ',
        '   /\  /  \\  /  \\   /\ ',
        '  /  \\/____\\/____\\ /  \\',
        ' /____\\ ||  || ||  /____\\',
        ' |    || ||  || ||  |    ||',
        ' |[]  || ||  || ||  |  []||',
        ' |____||_||__||_||__|____||',
        '   ||    ||    ||    ||   ',
        '  _||____||____||____||_  ',
        ' /______________________\ ',
        ' |  fires   fields   forge |',
        ' |________________________|'
      ],
      dungeon: [
        '#########################',
        '#    ___        ___     #',
        '#   |   |      |   |    #',
        '#   | []|  __  |[] |    #',
        '#   |___| |  | |___|    #',
        '#        |  |          #',
        '#   /\   |__|   /\      #',
        '#  /__\        /__\     #',
        '#      ________         #',
        '#     |  __  | |        #',
        '#     | |  | | |        #',
        '#########################'
      ]
    };

    const game = {
      phase: 'room',
      turn: 0,
      fire: 0,
      resources: { wood: 0, food: 0, hide: 0, iron: 0, relics: 0 },
      buildings: { huts: 0, lodge: false, smithy: false, guild: false, shrine: false },
      villagers: 0,
      villagerCap: 0,
      adventurers: [],
      gearLevel: 0,
      blessing: 0,
      dungeon: { depth: 0 },
      log: ['You wake in a cold, dark room. The embers are asleep.']
    };

    let currentActions = [];

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function rollDie(sides) {
      return randomInt(1, sides);
    }

    function addLog(text) {
      game.log.unshift(text);
      if (game.log.length > 4) game.log.pop();
    }

    function hasResources(costs) {
      return Object.entries(costs).every(([key, value]) => game.resources[key] >= value);
    }

    function spendResources(costs) {
      Object.entries(costs).forEach(([key, value]) => {
        game.resources[key] = Math.max(0, game.resources[key] - value);
      });
    }

    function generateName() {
      const base = NAMES[randomInt(0, NAMES.length - 1)];
      const epithet = EPITHETS[randomInt(0, EPITHETS.length - 1)];
      return `${base} ${epithet}`;
    }

    function partyPower() {
      return game.adventurers.reduce((sum, hero) => sum + hero.power, 0);
    }

    function advanceTurn() {
      game.turn += 1;
      if (game.phase === 'room' && game.fire > 0 && game.turn % 3 === 0) {
        game.fire -= 1;
        addLog('The hearth cools, shadows returning to the corners.');
      }
    }

    function roomScene() {
      if (game.fire <= 0) return SCENES.roomCold;
      if (game.fire <= 2) return SCENES.roomWarm;
      return SCENES.roomBright;
    }

    function getScene() {
      if (game.phase === 'room') return roomScene();
      if (game.phase === 'village') return SCENES.village;
      return SCENES.dungeon;
    }

    function gatherWood() {
      const gained = randomInt(1, 3);
      game.resources.wood += gained;
      if (Math.random() < 0.25) game.resources.food += 1;
      addLog(`You search the darkness. +${gained} wood.`);
    }

    function stokeFire() {
      spendResources({ wood: 1 });
      game.fire = Math.min(4, game.fire + 1);
      addLog('The fire catches, breathing a little warmth back into the room.');
    }

    function rest() {
      const mood = game.fire > 0 ? 'You warm your hands, listening to the crackle.' : 'The cold gnaws at your bones.';
      addLog(mood);
    }

    function buildFirstHut() {
      spendResources({ wood: 8 });
      game.buildings.huts = 1;
      game.villagers = 1;
      game.villagerCap = 2;
      game.phase = 'village';
      addLog('A hut rises outside. A lone settler answers the light.');
    }

    function chopWood() {
      const gained = randomInt(1, 2) + Math.floor(game.villagers / 2);
      game.resources.wood += gained;
      addLog(`Axes ring in the treeline. +${gained} wood.`);
    }

    function hunt() {
      const food = randomInt(1, 2) + Math.floor(game.villagers / 3);
      const hide = Math.random() < (game.buildings.lodge ? 0.6 : 0.3) ? 1 : 0;
      game.resources.food += food;
      game.resources.hide += hide;
      addLog(`Hunters return with provisions. +${food} food${hide ? ' and hides.' : '.'}`);
    }

    function scavenge() {
      const iron = randomInt(0, 1) + (Math.random() < 0.35 ? 1 : 0);
      const relic = Math.random() < 0.18 ? 1 : 0;
      game.resources.iron += iron;
      game.resources.relics += relic;
      addLog(`Scavengers pick through old ruins. +${iron} iron${relic ? ' and a relic.' : '.'}`);
    }

    function buildHut() {
      spendResources({ wood: 12 });
      game.buildings.huts += 1;
      game.villagerCap += 2;
      addLog('Another hut is raised, the village growing bolder.');
    }

    function callSettlers() {
      spendResources({ food: 5 });
      game.villagers += 1;
      addLog('A weary traveler joins the settlement.');
    }

    function buildLodge() {
      spendResources({ wood: 20, hide: 6 });
      game.buildings.lodge = true;
      addLog('A hunters\' lodge stands ready. The wilds feel less hostile.');
    }

    function buildSmithy() {
      spendResources({ wood: 25, iron: 6 });
      game.buildings.smithy = true;
      addLog('The smithy roars to life with sparks and steel.');
    }

    function buildGuild() {
      spendResources({ wood: 25, iron: 10, food: 12 });
      game.buildings.guild = true;
      addLog('A guildhall opens its doors. Adventurers gather.');
    }

    function buildShrine() {
      spendResources({ wood: 18, relics: 2 });
      game.buildings.shrine = true;
      addLog('A shrine of old runes hums with forgotten power.');
    }

    function recruitAdventurer() {
      spendResources({ food: 6, wood: 4 });
      const template = CLASS_TEMPLATES[randomInt(0, CLASS_TEMPLATES.length - 1)];
      const name = generateName();
      game.adventurers.push({
        name,
        className: template.name,
        hp: template.hp,
        maxHp: template.hp,
        power: template.power
      });
      addLog(`${name} the ${template.name} joins the guild.`);
    }

    function forgeGear() {
      spendResources({ iron: 4, hide: 2 });
      game.gearLevel += 1;
      addLog('New gear is forged. The party feels stronger.');
    }

    function pray() {
      spendResources({ relics: 1 });
      game.blessing = randomInt(1, 3);
      addLog(`A blessing settles over the village (+${game.blessing} to the next delve).`);
    }

    function enterDungeon() {
      game.phase = 'dungeon';
      addLog('The party descends into the old stone. Torches flare.');
    }

    function retreat() {
      game.phase = 'village';
      addLog('You retreat to the village, hauling your spoils.');
    }

    function camp() {
      spendResources({ food: 3 });
      game.adventurers.forEach((hero) => {
        const heal = hero.className === 'Cleric' ? 2 : 1;
        hero.hp = Math.min(hero.maxHp, hero.hp + heal);
      });
      addLog('A camp is made. Wounds are bound and prayers whispered.');
    }

    function hurtRandomAdventurer(damage) {
      if (game.adventurers.length === 0) return null;
      const index = randomInt(0, game.adventurers.length - 1);
      const hero = game.adventurers[index];
      hero.hp -= damage;
      if (hero.hp <= 0) {
        game.adventurers.splice(index, 1);
        return `${hero.name} falls in the dark.`;
      }
      return `${hero.name} suffers ${damage} damage.`;
    }

    function delve() {
      if (game.adventurers.length === 0) {
        addLog('No one remains to brave the depths.');
        retreat();
        return;
      }
      const nextDepth = game.dungeon.depth + 1;
      const roll = rollDie(20);
      const power = partyPower() + game.gearLevel;
      const blessing = game.blessing;
      game.blessing = 0;
      const threat = 6 + Math.floor(nextDepth / 2);
      const total = roll + power + blessing;
      game.dungeon.depth = nextDepth;

      let outcome = `Depth ${nextDepth}: you roll ${roll}`;
      if (blessing > 0) outcome += ` (+${blessing} blessing)`;
      outcome += `, power ${power}, total ${total}.`;

      if (roll === 1) {
        const loss = hurtRandomAdventurer(3);
        addLog(`${outcome} A catastrophic trap springs. ${loss}`);
      } else if (total < threat) {
        const loss = hurtRandomAdventurer(2);
        addLog(`${outcome} The denizens overwhelm you. ${loss}`);
      } else if (total < threat + 6) {
        const food = randomInt(1, 3);
        const iron = randomInt(0, 2);
        game.resources.food += food;
        game.resources.iron += iron;
        addLog(`${outcome} You win a scrappy fight. +${food} food, +${iron} iron.`);
      } else {
        const relics = roll === 20 ? 2 : 1;
        const iron = randomInt(1, 3);
        game.resources.relics += relics;
        game.resources.iron += iron;
        addLog(`${outcome} A legendary victory! +${relics} relics, +${iron} iron.`);
      }

      if (game.adventurers.length === 0) {
        addLog('The dungeon claims the last of your heroes.');
        retreat();
      }
    }

    function getActions() {
      const actions = [];

      if (game.phase === 'room') {
        actions.push({
          label: 'Search the dark (gain wood)',
          enabled: true,
          run: gatherWood
        });
        actions.push({
          label: 'Stoke the fire (1 wood)',
          enabled: game.resources.wood >= 1,
          run: stokeFire
        });
        actions.push({
          label: 'Sit and listen',
          enabled: true,
          run: rest
        });
        actions.push({
          label: 'Build a hut (8 wood, fire ≥ 1)',
          enabled: game.resources.wood >= 8 && game.fire >= 1,
          run: buildFirstHut
        });
      }

      if (game.phase === 'village') {
        actions.push({ label: 'Chop wood', enabled: game.villagers > 0, run: chopWood });
        actions.push({ label: 'Hunt', enabled: game.villagers > 0, run: hunt });
        actions.push({ label: 'Scavenge ruins', enabled: game.villagers > 1, run: scavenge });
        actions.push({
          label: 'Build hut (12 wood)',
          enabled: game.resources.wood >= 12,
          run: buildHut
        });
        actions.push({
          label: 'Call settlers (5 food)',
          enabled: game.resources.food >= 5 && game.villagers < game.villagerCap,
          run: callSettlers
        });
        if (!game.buildings.lodge) {
          actions.push({
            label: 'Build lodge (20 wood, 6 hide)',
            enabled: hasResources({ wood: 20, hide: 6 }),
            run: buildLodge
          });
        }
        if (!game.buildings.smithy) {
          actions.push({
            label: 'Build smithy (25 wood, 6 iron)',
            enabled: hasResources({ wood: 25, iron: 6 }),
            run: buildSmithy
          });
        }
        if (!game.buildings.guild) {
          actions.push({
            label: 'Build guildhall (25 wood, 10 iron, 12 food)',
            enabled: hasResources({ wood: 25, iron: 10, food: 12 }),
            run: buildGuild
          });
        }
        if (!game.buildings.shrine) {
          actions.push({
            label: 'Build shrine (18 wood, 2 relics)',
            enabled: hasResources({ wood: 18, relics: 2 }),
            run: buildShrine
          });
        }
        if (game.buildings.guild) {
          actions.push({
            label: 'Recruit adventurer (6 food, 4 wood)',
            enabled: hasResources({ food: 6, wood: 4 }),
            run: recruitAdventurer
          });
        }
        if (game.buildings.smithy) {
          actions.push({
            label: 'Forge gear (4 iron, 2 hide)',
            enabled: hasResources({ iron: 4, hide: 2 }),
            run: forgeGear
          });
        }
        if (game.buildings.shrine) {
          actions.push({
            label: 'Seek blessing (1 relic)',
            enabled: hasResources({ relics: 1 }),
            run: pray
          });
        }
        actions.push({
          label: 'Enter the dungeon',
          enabled: game.adventurers.length > 0,
          run: enterDungeon
        });
      }

      if (game.phase === 'dungeon') {
        actions.push({ label: 'Delve deeper', enabled: game.adventurers.length > 0, run: delve });
        actions.push({ label: 'Make camp (3 food)', enabled: hasResources({ food: 3 }), run: camp });
        actions.push({ label: 'Retreat to village', enabled: true, run: retreat });
      }

      return actions;
    }

    function renderHud() {
      const { wood, food, hide, iron, relics } = game.resources;
      const village = game.phase === 'room'
        ? `Hearth: ${game.fire}`
        : `Villagers: ${game.villagers}/${game.villagerCap} | Gear: +${game.gearLevel}`;
      const party = `Adventurers: ${game.adventurers.length} | Depth: ${game.dungeon.depth}`;
      document.getElementById('hud').textContent =
        `Wood ${wood} • Food ${food} • Hide ${hide} • Iron ${iron} • Relics ${relics} • ${village} • ${party}`;
    }

    function renderScreen() {
      const scene = getScene();
      const status = [
        `Turn ${game.turn} • Phase: ${game.phase.toUpperCase()}`,
        game.phase === 'room'
          ? 'The room is quiet. The world outside is waiting.'
          : 'The village listens for the next tale from the dungeon.',
        ''
      ];

      const partyLines = game.adventurers.length === 0
        ? ['No adventurers yet.']
        : game.adventurers.map((hero) =>
            `${hero.name} the ${hero.className} (HP ${hero.hp}/${hero.maxHp}, Power ${hero.power})`
          );

      const logLines = ['--- Whispers ---', ...game.log.map((line) => `• ${line}`)];

      document.getElementById('screen').textContent =
        [...scene, '', ...status, ...partyLines, '', ...logLines].join('\n');
    }

    function renderControls() {
      const controls = document.getElementById('controls');
      controls.innerHTML = '';
      const actions = getActions().slice(0, ACTION_KEYS.length);
      currentActions = actions.map((action, index) => ({ ...action, key: ACTION_KEYS[index] }));

      currentActions.forEach((action) => {
        const button = document.createElement('button');
        button.disabled = !action.enabled;
        button.textContent = `[${action.key}] ${action.label}`;
        button.addEventListener('click', () => performAction(action));
        controls.appendChild(button);
      });

      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'Click an action or press its key to act.';
      controls.appendChild(hint);
    }

    function performAction(action) {
      if (!action.enabled) return;
      action.run();
      advanceTurn();
      render();
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const action = currentActions.find((entry) => entry.key === key);
      if (action) {
        event.preventDefault();
        performAction(action);
      }
    });

    function render() {
      renderHud();
      renderScreen();
      renderControls();
    }

    render();
  </script>
</body>
</html>
